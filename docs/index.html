<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tai-One Media — App</title>
  <meta name="description" content="Tai-One Media in-app experience: welcome, browse articles, sign in/register (demo).">
  <style>
    /* Minimal page chrome so the app is centered on larger screens */
    html,body{height:100%;margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    #app-root{max-width:980px;margin:0 auto;padding:12px}
    header.page-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
    a.home-link{color:#0ea5a4;text-decoration:none}
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Tai-One Media — App</h1>
    <nav aria-label="Site">
      <a class="home-link" href="/">Website</a>
    </nav>
  </header>

  <main id="app-root" role="main">
    <!-- MobileUI will mount inside this element -->
  </main>

  <noscript>
    <p>JavaScript is required to run the Tai-One Media app. Please enable JavaScript and reload the page.</p>
  </noscript>

  <script type="module">
    // Import the MobileUI component and initialize it inside #app-root
    import MobileUI from '../src/ui/mobile-ui.js';

    (function(){
      try {
        const root = document.getElementById('app-root');
        const ui = new MobileUI({ container: root });
        ui.init();

        // Ensure a route is present for accessibility
        if (!window.location.hash) window.location.hash = '#welcome';

        // Expose ui for debugging in the console (optional)
        window.__TaiOneMobileUI = ui;
      } catch (err) {
        console.error('Failed to initialize MobileUI', err);
        const root = document.getElementById('app-root');
        if (root) root.innerHTML = '<p>Unable to start the app. Check console for details.</p>';
      }
    })();
  </script>
</body>
</html>
